# Publish a GitHub release; HACS offers releases as updates. Either press
# "Run workflow" on the Actions tab (it tags the commit with manifest.json's
# version) or push a tag like v0.6.1.
name: Release

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Delete this version's existing release and tag first (only after rewriting history)
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the manifest
        id: version
        run: |
          tag="v$(jq -r .version custom_components/virtual_pet/manifest.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but manifest.json says $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ "$REPLACE" = true ]; then
            gh release delete "$TAG" --cleanup-tag --yes || true
            git push origin ":refs/tags/$TAG" || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              # Publishing a release in the web UI creates its tag, which runs this.
              echo "::notice::$TAG was already released by hand; nothing to do"
              exit 0
            fi
            echo "::error::$TAG is already released; bump the version first"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
