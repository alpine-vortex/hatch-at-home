# Throwaway Home Assistant for developing the pet. Never point this at
# real devices. Run it with scripts/develop, then open http://localhost:8123.
homeassistant:
  name: Pet test bench
  time_zone: America/Los_Angeles
  unit_system: us_customary
  latitude: 32.87336  # Home Assistant's demo location
  longitude: -117.22743
  elevation: 0

frontend:
sun:
config:
history:
logbook:
logger:
  default: warning
  logs:
    custom_components.virtual_pet: debug

# --- Stand-ins for the real house (used from phase 3) ---------------------

input_select:
  fake_weather:
    name: Fake weather
    # lightning and windy are the card's storm and wind (home.py STORMY, WINDY).
    options: [sunny, partlycloudy, cloudy, rainy, pouring, snowy, fog, clear-night, lightning, lightning-rainy, windy]
    initial: rainy

  # The robot vacuum's state (a template vacuum below reads it).
  fake_vacuum:
    name: Fake vacuum state
    options: [docked, cleaning, returning, paused, idle]
    initial: docked

input_button:
  # A doorbell press: the template event below fires "ring" on each press.
  fake_doorbell:
    name: Fake doorbell press

input_number:
  fake_indoor_temp:
    name: Fake indoor temperature
    min: 50
    max: 90
    step: 0.5
    unit_of_measurement: "°F"
    initial: 71
  fake_lux:
    name: Fake lux
    min: 0
    max: 3000
    step: 10
    unit_of_measurement: lx
    initial: 60
  fake_lamp_level:
    name: Fake living room lamp brightness
    min: 0
    max: 255
    step: 5
    initial: 0
  fake_bedroom_level:
    name: Fake bedroom light brightness
    min: 0
    max: 255
    step: 5
    initial: 200
  fake_rain_rate:
    name: Fake rain rate
    min: 0
    max: 2
    step: 0.01
    unit_of_measurement: in/h
    initial: 0
  fake_aqi:
    name: Fake AQI
    min: 0
    max: 300
    step: 1
    initial: 40

input_boolean:
  fake_someone_home:
    name: Fake someone home
    initial: true
  fake_motion:
    name: Fake motion
  fake_music:
    name: Fake music playing
  fake_tv:
    name: Fake TV on
  # Stand-ins for the activity keys (device-alive 4C): map each in the pet's
  # options (fireplace, heating, cooling) and flip it; the TV and music ones are
  # read through the media players below.
  fake_fireplace:
    name: Fake fireplace lit
  fake_heating:
    name: Fake heating on
  fake_cooling:
    name: Fake cooling on
  # Stand-in for a washer (device-alive 4D, ha-signals H6): the binary sensor below
  # reads it. See the template block for how to make it count as a finished cycle.
  fake_washer:
    name: Fake washer running

# A media_player is what the pet's TV and music options take, and the booleans above
# are not one: these read them (on = playing). Music "playing" is not a video, so
# it is music, not the TV.
media_player:
  - platform: universal
    name: Fake TV
    unique_id: fake_tv_player
    state_template: "{{ 'playing' if is_state('input_boolean.fake_tv', 'on') else 'off' }}"
  - platform: universal
    name: Fake speaker
    unique_id: fake_music_player
    state_template: "{{ 'playing' if is_state('input_boolean.fake_music', 'on') else 'paused' }}"

template:
  - sensor:
      - name: Fake indoor temperature sensor
        unique_id: fake_indoor_temperature_sensor
        device_class: temperature
        unit_of_measurement: "°F"
        state: "{{ states('input_number.fake_indoor_temp') }}"
      - name: Fake illuminance
        unique_id: fake_illuminance
        device_class: illuminance
        unit_of_measurement: lx
        state: "{{ states('input_number.fake_lux') }}"
      - name: Fake air quality index
        unique_id: fake_aqi
        device_class: aqi
        state: "{{ states('input_number.fake_aqi') | int }}"
      - name: Fake people home
        unique_id: fake_people_home_count
        state: "{{ 1 if is_state('input_boolean.fake_someone_home', 'on') else 0 }}"
  - light:
      - name: Fake living room lamp
        unique_id: fake_living_room_lamp
        state: "{{ states('input_number.fake_lamp_level') | int > 0 }}"
        level: "{{ states('input_number.fake_lamp_level') | int }}"
        turn_on:
          action: input_number.set_value
          target: { entity_id: input_number.fake_lamp_level }
          data: { value: 200 }
        turn_off:
          action: input_number.set_value
          target: { entity_id: input_number.fake_lamp_level }
          data: { value: 0 }
        set_level:
          action: input_number.set_value
          target: { entity_id: input_number.fake_lamp_level }
          data: { value: "{{ brightness }}" }
      - name: Fake bedroom light
        unique_id: fake_bedroom_light
        state: "{{ states('input_number.fake_bedroom_level') | int > 0 }}"
        level: "{{ states('input_number.fake_bedroom_level') | int }}"
        turn_on:
          action: input_number.set_value
          target: { entity_id: input_number.fake_bedroom_level }
          data: { value: 200 }
        turn_off:
          action: input_number.set_value
          target: { entity_id: input_number.fake_bedroom_level }
          data: { value: 0 }
        set_level:
          action: input_number.set_value
          target: { entity_id: input_number.fake_bedroom_level }
          data: { value: "{{ brightness }}" }
  - sensor:
      - name: Fake rain rate
        unique_id: fake_rain_rate_sensor
        unit_of_measurement: in/h
        state: "{{ states('input_number.fake_rain_rate') }}"
  - binary_sensor:
      - name: Fake motion sensor
        unique_id: fake_motion_sensor
        device_class: occupancy
        state: "{{ is_state('input_boolean.fake_motion', 'on') }}"
  # The robot vacuum: found by its domain, no mapping in the options. Set
  # input_select.fake_vacuum to cleaning (robot_out), then to returning or docked
  # (robot_home, only after a run the pet saw start).
  - vacuum:
      - name: Fake vacuum
        unique_id: fake_vacuum
        state: "{{ states('input_select.fake_vacuum') }}"
        start:
          action: input_select.select_option
          target: { entity_id: input_select.fake_vacuum }
          data: { option: cleaning }
        return_to_base:
          action: input_select.select_option
          target: { entity_id: input_select.fake_vacuum }
          data: { option: returning }
        pause:
          action: input_select.select_option
          target: { entity_id: input_select.fake_vacuum }
          data: { option: paused }
        stop:
          action: input_select.select_option
          target: { entity_id: input_select.fake_vacuum }
          data: { option: idle }
  # The doorbell: found by its event domain and device class doorbell, no mapping.
  # Press input_button.fake_doorbell. The pet's own cooldown is 30 minutes.
  - triggers:
      - trigger: state
        entity_id: input_button.fake_doorbell
    event:
      - name: Fake doorbell
        unique_id: fake_doorbell_event
        device_class: doorbell
        event_type: ring
        event_types: "{{ ['ring'] }}"
  # The washer (map binary_sensor.fake_washer_running under "appliances" in the
  # pet's options): kind washer comes from the entity id. Turn the boolean on, wait
  # about 16 minutes, turn it off: appliance_done {kind: washer}. The run only counts
  # once a read lands after APPLIANCE_RUN_MINUTES (10): a state change or the 5-min
  # tick, so an 11-minute run can miss it.
  # Once an hour per machine.
  - binary_sensor:
      - name: Fake washer running
        unique_id: fake_washer_running
        state: "{{ is_state('input_boolean.fake_washer', 'on') }}"
  - weather:
      - name: Fake weather
        unique_id: fake_weather
        condition_template: "{{ states('input_select.fake_weather') }}"
        temperature_template: "52"
        humidity_template: "85"
        temperature_unit: "°F"
      # A second weather entity on purpose: with two to choose from, a new dev pet
      # is not given a weather by default (ha-signals H2 fills only when one is
      # clear), so card-check's pets stay bare, as its sections expect.
      - name: Spare weather
        unique_id: spare_weather
        condition_template: "sunny"
        temperature_template: "60"
        humidity_template: "40"
        temperature_unit: "°F"

# --- The card -----------------------------------------------------------------

lovelace:
  # The integration loads the card itself; no resource needed.
  dashboards:
    pet-bench:
      mode: yaml
      title: Pet bench
      icon: mdi:bird
      show_in_sidebar: true
      filename: dashboards/pet.yaml
