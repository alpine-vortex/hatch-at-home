fast_forward:
  fields:
    hours:
      required: true
      example: 6
      selector:
        number:
          min: 0.1
          max: 168
          step: 0.1
          unit_of_measurement: h
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: virtual_pet
notify_me:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    enabled:
      required: true
      example: true
      selector:
        boolean:
visit:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
my_day:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    enabled:
      required: true
      example: true
      selector:
        boolean:
set_shell:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    finish:
      example: stripes
      selector:
        text:
play_game:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    game:
      required: false
      default: left_right
      example: higher_lower
      selector:
        select:
          options:
            - left_right
            - higher_lower
            - dig
    guess:
      required: false
      example: left
      selector:
        select:
          options:
            - left
            - right
            - lower
            - higher
            - keep
            - dig
    end:
      required: false
      default: false
      example: true
      selector:
        boolean:
    shared:
      required: false
      default: false
      selector:
        boolean:
share_news:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
          multiple: true
    headline:
      required: true
      example: "Tamagotchi turns 30!"
      selector:
        text:
    topic:
      example: Tamagotchi
      selector:
        text:
react:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
          multiple: true
    category:
      required: true
      example: washer
      selector:
        select:
          translation_key: category
          options:
            - heater
            - ac
            - fan
            - washer
            - dryer
            - dishwasher
            - oven
            - coffee
            - printer
            - ev
            - feeder
            - plants
            - delivery
            - timer
            - internet
            - custom
    source:
      example: binary_sensor.washer_running
      selector:
        entity:
    from_state:
      example: "on"
      selector:
        text:
    to_state:
      example: "off"
      selector:
        text:
    held:
      example: 1800
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
    match:
      example: finished
      selector:
        text:
    reaction:
      example: cheer
      selector:
        select:
          translation_key: reaction
          options:
            - hop
            - cheer
            - cozy
            - dance
            - startle
    text:
      example: "the bread's ready! ♪"
      selector:
        text:
