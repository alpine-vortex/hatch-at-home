fast_forward:
  fields:
    hours:
      required: true
      example: 6
      selector:
        number:
          min: 0.1
          max: 168
          step: 0.1
          unit_of_measurement: h
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: virtual_pet
notify_me:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    enabled:
      required: true
      example: true
      selector:
        boolean:
play_game:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
    guess:
      required: true
      example: left
      selector:
        select:
          options:
            - left
            - right
share_news:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: virtual_pet
          multiple: true
    headline:
      required: true
      example: "Tamagotchi turns 30!"
      selector:
        text:
    topic:
      example: Tamagotchi
      selector:
        text:
